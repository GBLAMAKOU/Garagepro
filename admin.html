<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>Admin - GaragePro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f172a;color:white;padding:14px;max-width:600px;margin:0 auto}
.card{background:#1e293b;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #334155}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:12px 0}
.s{background:#0f172a;padding:12px;border-radius:12px;text-align:center;border:1px solid #334155}
.s b{font-size:20px;display:block;color:#22c55e}
h1{font-size:20px;margin-bottom:10px}
.item{background:#0f172a;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;border:1px solid #334155}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.paid{background:#22c55e;color:black}.free{background:#f59e0b;color:black}
button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;background:#22c55e;cursor:pointer}
</style></head><body>
<div class="card"><h1>🔐 Admin GaragePro - 0153436598</h1>
<div class="stats">
<div class="s"><b id="a">0</b>En attente</div>
<div class="s"><b id="v">0</b>Validés</div>
<div class="s"><b id="g">0</b>Garages</div>
<div class="s"><b id="e">0F</b>Encaissé</div>
</div>
<button onclick="load()">🔄 Actualiser</button>
</div>

<div class="card"><h1>💰 Paiements 5000F</h1><div id="pays">Aucun paiement</div></div>
<div class="card"><h1>🏢 Tous les garages</h1><div id="list">Chargement...</div></div>

<script>
const URL='https://fzoukuaadwvnnppkiqkf.supabase.co';
const KEY='sb_publishable_JKJdHn9ciVp2Rh8Fbr62Hg_Neh8uNGL';
const sb=supabase.createClient(URL,KEY);
async function load(){
  const {data,error}=await sb.from('garages').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('list').innerHTML='Erreur: '+error.message;return;}
  document.getElementById('g').innerText=data.length;
  document.getElementById('a').innerText=data.filter(x=>!x.is_premium).length;
  document.getElementById('v').innerText=data.filter(x=>x.is_premium).length;
  document.getElementById('e').innerText=(data.filter(x=>x.is_premium).length*5000)+'F';
  if(data.length==0){document.getElementById('list').innerHTML='Aucun garage pour le moment. Partage ton lien app.html';document.getElementById('pays').innerHTML='Aucun paiement';return;}
  document.getElementById('list').innerHTML=data.map(x=>`<div class="item"><div><b>${x.nom_garage}</b><br><small>${x.telephone} - ${x.nombre_vehicules} véhicules</small></div><div class="badge ${x.is_premium?'paid':'free'}">${x.is_premium?'PAYÉ':'GRATUIT'}</div></div>`).join('');
  let payes=data.filter(x=>x.is_premium);
  document.getElementById('pays').innerHTML=payes.length?payes.map(x=>`<div class="item"><div>${x.nom_garage} - ${x.telephone}</div><b style="color:#22c55e">5000F</b></div>`).join(''):'Aucun paiement';
}load();
</script></body></html>
