<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GaragePro - Mémoire</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-bold mb-1">GaragePro</h1>
  <p class="text-sm text-gray-600 mb-4">Mémoire du garage - BH 34 30 RB</p>
  
  <input id="search" placeholder="Rechercher plaque BH..." class="w-full p-3 rounded-lg border mb-4" oninput="afficher()">

  <div class="bg-white p-4 rounded-xl shadow mb-6">
    <h2 class="font-bold mb-3">Nouvelle intervention</h2>
    <input id="plaque" placeholder="Plaque ex: BH 3430 RB" class="w-full p-2 border rounded mb-2">
    <input id="client" placeholder="Nom client ex: Michel" class="w-full p-2 border rounded mb-2">
    <input id="km" placeholder="Kilométrage ex: 250800" class="w-full p-2 border rounded mb-2">
    <textarea id="panne" placeholder="Panne voiture" class="w-full p-2 border rounded mb-2"></textarea>
    <textarea id="travaux" placeholder="Travaux effectués" class="w-full p-2 border rounded mb-2"></textarea>
    <input id="prix" placeholder="Prix ex: 17000F" class="w-full p-2 border rounded mb-3">
    <button onclick="ajouter()" class="w-full bg-black text-white p-3 rounded-lg font-bold">Enregistrer</button>
  </div>

  <div id="liste"></div>
</div>
<script>
let data = JSON.parse(localStorage.getItem('garagepro')||'[]');
function ajouter(){
  if(!plaque.value) return alert('Mets la plaque');
  data.unshift({plaque:plaque.value.toUpperCase(), client:client.value, km:km.value, panne:panne.value, travaux:travaux.value, prix:prix.value, date:new Date().toLocaleDateString()});
  localStorage.setItem('garagepro', JSON.stringify(data));
  plaque.value=client.value=km.value=panne.value=travaux.value=prix.value='';
  afficher();
}
function afficher(){
  let q = search.value.toUpperCase();
  let filtre = data.filter(d=>d.plaque.includes(q));
  liste.innerHTML = filtre.map(d=>`
    <div class="bg-white p-4 rounded-xl shadow mb-3 border-l-4 border-black">
      <div class="flex justify-between"><b>${d.plaque}</b><span class="text-xs">${d.date}</span></div>
      <div class="text-sm text-gray-600">${d.client} - ${d.km} km - ${d.prix}</div>
      <div class="mt-2 text-sm"><b>Panne:</b> ${d.panne}</div>
      <div class="text-sm"><b>Travaux:</b> ${d.travaux}</div>
    </div>
  `).join('') || '<p class="text-center text-gray-400 mt-10">Aucun résultat</p>';
}
afficher();
</script>
</body>
</html>
