<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GaragePro App</title><style>body{font-family:sans-serif;background:#f3f4f6;margin:0;padding:15px}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.card{background:white;padding:15px;border-radius:12px;margin-bottom:12px}.repair{border-left:3px solid #16a34a;background:#f0fdf4;padding:8px;margin:6px 0;border-radius:0 8px 8px 0}.btn{width:100%;padding:14px;background:#16a34a;color:white;border:none;border-radius:10px;font-weight:bold}</style></head><body><h2>🔧 GaragePro - Mémoire</h2><input id="search" placeholder="🔍 Rechercher plaque: BH..." oninput="afficher()" style="border:2px solid #2563eb"><div class="card"><h3>Ajouter réparation</h3><input id="plaque" placeholder="Plaque ex: BH 34 30 RB"><input id="nom" placeholder="Nom client"><input id="panne" placeholder="Travail fait"><input id="prix" type="number" placeholder="Prix FCFA"><input id="km" type="number" placeholder="KM"><button class="btn" onclick="ajouter()">Enregistrer aujourd'hui</button></div><div id="liste"></div><script>let g=JSON.parse(localStorage.getItem('garagepro_history')||'[]');function ajouter(){let p=document.getElementById('plaque').value.toUpperCase().trim();if(!p)return alert('Plaque?');let v=g.find(x=>x.plaque===p);if(!v){v={plaque:p,nom:document.getElementById('nom').value,reparations:[]};g.push(v);}v.reparations.unshift({date:new Date().toLocaleDateString('fr-FR'),panne:document.getElementById('panne').value,prix:document.getElementById('prix').value,km:document.getElementById('km').value});localStorage.setItem('garagepro_history',JSON.stringify(g));afficher();}function afficher(){let s=document.getElementById('search').value.toUpperCase();let h='';g.filter(v=>v.plaque.includes(s)).forEach(v=>{h+=`<div class=card><b>${v.plaque}</b> - ${v.nom}<br><small>${v.reparations.length} interventions</small>`;v.reparations.forEach(r=>{h+=`<div class=repair><b>${r.date}</b> - ${r.panne}<br>${r.prix}F | ${r.km}km</div>`});h+=`</div>`});document.getElementById('liste').innerHTML=h;}afficher();</script></body></html>
