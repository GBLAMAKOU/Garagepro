<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GaragePro - Mémoire</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto">
<h1 class="text-2xl font-bold mb-1">GaragePro</h1>
<p class="text-sm text-gray-600 mb-4">Mémoire du garage </p>

<input id="search" placeholder="Rechercher plaque ..." class="w-full p-3 rounded-lg border mb-4" oninput="afficher()">

<div id="liste" class="bg-white p-4 rounded-xl shadow mb-6">
</div>

</div>

<script>
function afficher(){
let data = JSON.parse(localStorage.getItem('garage') || '[]');
let q = document.getElementById('search').value.toLowerCase();
let filtres = data.filter(d => (d.client + d.panne + d.date).toLowerCase().includes(q));
document.getElementById('liste').innerHTML = filtres.map(d => `
<div class="border-b py-3">
<div class="flex justify-between"><b>${d.plaque || ''}</b><span class="text-xs">${d.date}</span></div>
<div class="text-sm text-gray-600">${d.client} - ${d.km} km - ${d.prix}</div>
<div class="mt-2 text-sm"><b>Panne:</b> ${d.panne}</div>
<div class="text-sm"><b>Travaux:</b> ${d.travaux}</div>
</div>
`).join('') || '<p class="text-center text-gray-400 mt-10">Aucun résultat</p>';
}
afficher();
</script>
</body>
</html>
